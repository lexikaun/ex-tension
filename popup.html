<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">InstaPlayer <span class="badge">Pro</span></div>
        </header>
        
        <main>
            <div id="status-panel" class="panel">
                <div class="status-indicator" id="status-dot"></div>
                <div class="status-text">
                    <h2 id="status-heading">Checking site...</h2>
                    <p id="status-desc">Looking for video elements.</p>
                </div>
            </div>

            <div id="action-panel" class="panel hidden">
                <button id="enable-btn" class="primary-btn">Enable on this site</button>
                <p class="micro-copy">Requires permission to read video elements on this domain.</p>
            </div>
        </main>
        
        <footer>
            <div class="shortcut-hint">Press <strong>P</strong> for PiP</div>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
