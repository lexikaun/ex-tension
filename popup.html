<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- MAIN VIEW -->
        <div id="main-view" class="view active">
            <header>
                <div class="logo">Ex-Tension <span class="badge">Media</span></div>
                <button id="nav-settings" class="icon-btn" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </header>
            
            <div id="status-panel" class="panel">
                <div class="status-indicator" id="status-dot"></div>
                <div class="status-text">
                    <h2 id="status-heading">Checking site...</h2>
                    <p id="status-desc">Probing for media...</p>
                </div>
            </div>

            <div id="action-panel" class="panel hidden">
                <button id="enable-btn" class="primary-btn">Enable on this site</button>
                <p class="micro-copy">Requires permission to automatically manage video on this domain.</p>
            </div>

            <div id="controls-panel" class="panel hidden">
                <div class="control-group">
                    <div class="control-header">
                        <label>Playback Speed</label>
                        <span id="speed-val" class="val-display">1.00x</span>
                    </div>
                    <input type="range" id="speed-slider" min="0.25" max="5.0" step="0.25" value="1.0">
                    <button id="reset-speed-btn" class="text-btn">Reset to 1.0x</button>
                </div>

                <div class="divider"></div>

                <div class="control-group">
                    <div class="control-header">
                        <label>Audio Boost</label>
                        <span id="vol-val" class="val-display">100%</span>
                    </div>
                    <input type="range" id="vol-slider" min="0" max="400" step="10" value="100">
                </div>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="settings-view" class="view hidden">
            <header>
                <button id="nav-main" class="icon-btn" title="Back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="logo">Settings</div>
                <div style="width: 18px;"></div> <!-- Spacer -->
            </header>

            <div class="panel scrollable">
                <h3>Preferences</h3>
                <div class="setting-row">
                    <label title="Target playback speed on load">Default Speed</label>
                    <input type="number" id="pref-default-speed" min="0.25" max="5.0" step="0.25">
                </div>
                <div class="setting-row">
                    <label title="Target volume on load (0-800%)">Default Vol (%)</label>
                    <input type="number" id="pref-default-vol" min="0" max="800" step="10">
                </div>
                <div class="setting-row">
                    <label title="Absolute ceiling for audio boost">Max Boost (%)</label>
                    <input type="number" id="pref-max-vol" min="100" max="800" step="50">
                </div>
                <div class="setting-row checkbox-row">
                    <label title="Maintain pitch when changing speed">Pitch Correction</label>
                    <input type="checkbox" id="pref-pitch">
                </div>

                <div class="divider"></div>

                <div class="section-header">
                    <h3>Custom Presets</h3>
                    <button id="add-preset-btn" class="text-btn">+ Add New</button>
                </div>
                <div id="preset-creator" class="preset-creator hidden">
                    <div class="setting-row">
                        <label>Preset Type</label>
                        <select id="new-preset-type" class="preset-select">
                            <option value="speed">Playback Speed</option>
                            <option value="volume">Audio Boost</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label id="new-preset-val-label">Target Speed (x)</label>
                        <input type="number" id="new-preset-val" min="0.25" max="5.0" step="0.25" value="2.0">
                    </div>
                    <div class="setting-row">
                        <label>Keybinding</label>
                        <button id="new-preset-key-btn" class="keybind-btn">Click to Bind</button>
                    </div>
                    <div class="preset-actions">
                        <button id="cancel-preset-btn" class="secondary-btn small-btn">Cancel</button>
                        <button id="save-preset-btn" class="primary-btn small-btn">Save</button>
                    </div>
                </div>
                <div id="preset-list" class="keybind-grid" style="margin-bottom: 12px;">
                    <!-- Populated via JS -->
                </div>

                <div class="divider"></div>

                <h3>Keybindings</h3>
                <p class="micro-copy error-text hidden" id="rebind-error">Conflict detected.</p>
                <div id="keybind-grid" class="keybind-grid">
                    <!-- Populated via JS -->
                </div>
                
                <button id="reset-settings-btn" class="secondary-btn" style="margin-top: 16px;">Reset Defaults</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
